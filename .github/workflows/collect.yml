name: Collect FC Clubs matches

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - config.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fc-clubs-collector
  cancel-in-progress: false

jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always start from the latest main, even when re-running an older run,
      # so the archive is never rebuilt from stale data and then conflicts.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser-compatible HTTP transport
        run: python -m pip install curl_cffi==0.16.1
      - name: Collect new matches
        run: python collect.py
      - name: Preserve updated archive
        run: |
          # Every run refreshes last_updated/checked_at. Only commit when
          # something else changed; the Pages deploy below still publishes
          # the fresh timestamp so the dashboard does not show ARCHIVE DELAYED.
          if python - <<'EOF'
          import json, subprocess, sys
          volatile = {"data/matches.json": "last_updated", "data/status.json": "checked_at"}
          for path, key in volatile.items():
              try:
                  old = json.loads(subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, check=True).stdout)
              except subprocess.CalledProcessError:
                  sys.exit(1)
              new = json.load(open(path, encoding="utf-8"))
              old.pop(key, None)
              new.pop(key, None)
              if old != new:
                  sys.exit(1)
          EOF
          then
            echo "No data changes beyond refresh timestamps"
            exit 0
          fi
          git config user.name "basket-carriers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data: collect latest FC Clubs matches"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
